<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Thanksgiving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
body{margin:0;background:#2a140b}
a{color:#f3c77a}a:hover{color:#ffe2a8}
.tg-card{container-type:inline-size;perspective:1600px}
.tg-photo{animation:tgSettle 2.6s cubic-bezier(.2,.7,.2,1) .6s both}
@keyframes tgSettle{from{transform:scale(1.14);filter:brightness(.6) saturate(.8)}to{transform:scale(1);filter:none}}
.tg-door-l{transform-origin:left center;animation:tgDoorL 1.5s cubic-bezier(.6,0,.25,1) .5s forwards}
.tg-door-r{transform-origin:right center;animation:tgDoorR 1.5s cubic-bezier(.6,0,.25,1) .5s forwards}
@keyframes tgDoorL{0%{transform:rotateY(0)}85%{opacity:1}100%{transform:rotateY(-112deg);opacity:0;visibility:hidden}}
@keyframes tgDoorR{0%{transform:rotateY(0)}85%{opacity:1}100%{transform:rotateY(112deg);opacity:0;visibility:hidden}}
.tg-pop{display:block;opacity:0;transform:scale(0);animation:tgPop .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes tgPop{0%{opacity:0;transform:scale(0) translateY(40%)}55%{opacity:1;transform:scale(1.14) translateY(0)}75%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
.tg-rise{opacity:0;animation:tgRise 1s ease-out 3.3s both}
@keyframes tgRise{from{opacity:0;transform:translateY(60%);letter-spacing:.2em}to{opacity:1;transform:none;letter-spacing:.01em}}
.tg-glow{animation:tgGlow 1.6s ease-out 2.6s both}
@keyframes tgGlow{0%{opacity:0;transform:scale(.3)}40%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
.tg-hair-l{transform-origin:70% 0;animation:tgSwayL 3.4s ease-in-out infinite alternate}
.tg-hair-r{transform-origin:30% 0;animation:tgSwayR 3.9s ease-in-out -1.2s infinite alternate}
@keyframes tgSwayL{0%{transform:skewX(0) rotate(0)}35%{transform:skewX(-3deg) rotate(.6deg)}65%{transform:skewX(-1.5deg) rotate(.2deg)}100%{transform:skewX(-4.5deg) rotate(.9deg) scaleY(1.01)}}
@keyframes tgSwayR{0%{transform:skewX(0) rotate(0)}40%{transform:skewX(3.5deg) rotate(-.6deg)}70%{transform:skewX(1.5deg)}100%{transform:skewX(4.5deg) rotate(-.8deg) scaleY(1.01)}}
.tg-leaf{opacity:0;animation:tgFall linear infinite}
@keyframes tgFall{0%{opacity:0;transform:translate(0,-10%) rotate(0)}10%{opacity:.95}50%{transform:translate(-30px,450%) rotate(200deg)}90%{opacity:.9}100%{opacity:0;transform:translate(25px,950%) rotate(400deg)}}
.tg-replay{transition:background .2s,transform .2s}
.tg-replay:hover{background:#f3c77a;color:#2a140b;transform:translateY(-1px)}
.tg-replay:focus-visible{outline:3px solid #ffe2a8;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.tg-photo,.tg-hair-l,.tg-hair-r,.tg-leaf,.tg-glow{animation:none}.tg-door-l,.tg-door-r{animation-duration:.01s;animation-delay:0s}.tg-pop,.tg-rise{animation:none;opacity:1;transform:none}}
</style>
</head>
